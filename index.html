<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f5f1e8" />
  <title>ゆるラン</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root{
      --bg:#f5f1e8;
      --card:#fffdf8;
      --text:#2f342f;
      --muted:#747a74;
      --line:#ddd8ce;
      --accent:#466a57;
      --accent2:#dfe9e2;
      --rest:#ebe4d7;
      --shadow:0 10px 30px rgba(50,50,40,.08);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Noto Sans JP","Yu Gothic UI",sans-serif;
      background:var(--bg); color:var(--text);
    }
    .wrap{max-width:720px;margin:auto;padding:18px 16px 88px}
    header{padding:14px 4px 6px}
    h1{font-size:26px;margin:0 0 4px;letter-spacing:.02em}
    .sub{color:var(--muted);font-size:14px}
    .card{
      background:var(--card); border:1px solid var(--line);
      border-radius:22px; padding:18px; margin-top:14px; box-shadow:var(--shadow);
    }
    .today{font-size:14px;color:var(--muted);margin-bottom:10px}
    .question{font-size:20px;font-weight:750;margin:0 0 14px}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    button{
      font:inherit; border:none; border-radius:16px; padding:14px 12px;
      cursor:pointer; transition:.15s transform,.15s opacity,.15s background;
    }
    button:active{transform:scale(.98)}
    .act{
      background:var(--accent2); color:var(--text); min-height:64px;
      font-weight:700; border:1px solid #cfdcd2;
    }
    .act.rest{background:var(--rest);border-color:#dfd6c6}
    .act.selected{outline:3px solid var(--accent);background:#edf4ef}
    .small{font-size:12px;font-weight:500;color:var(--muted);display:block;margin-top:2px}
    .optional{margin-top:16px}
    .label{font-size:13px;color:var(--muted);margin-bottom:8px}
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{background:#f1eee7;border:1px solid var(--line);padding:9px 12px;border-radius:999px}
    .chip.selected{background:var(--accent);color:white;border-color:var(--accent)}
    textarea{
      width:100%;min-height:72px;resize:vertical;border:1px solid var(--line);
      background:#fff;border-radius:14px;padding:11px;font:inherit;color:var(--text)
    }
    .save{
      width:100%;margin-top:16px;background:var(--accent);color:white;
      font-weight:800;font-size:17px;padding:15px;border-radius:16px;
    }
    .save:disabled{opacity:.45;cursor:default}
    .message{
      margin-top:14px;padding:13px 14px;border-radius:14px;background:#f0f5f1;
      color:#385244;display:none
    }
    .trail{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:12px}
    .day{
      min-height:72px;border:1px solid var(--line);border-radius:14px;background:#faf8f3;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:4px;padding:6px;text-align:center
    }
    .dow{font-size:11px;color:var(--muted)}
    .icon{font-size:22px}
    .mini{font-size:11px;color:var(--muted)}
    .principles{margin:0;padding-left:1.2em;line-height:1.8}
    details{margin-top:8px}
    summary{cursor:pointer;color:var(--accent);font-weight:700}
    .history{margin-top:12px;display:grid;gap:8px}
    .row{
      display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding-top:10px
    }
    .row:first-child{border-top:none}
    .row-main{flex:1}
    .row-date{font-size:13px;color:var(--muted)}
    .row-note{font-size:13px;margin-top:3px;white-space:pre-wrap}
    .ghost{background:transparent;border:1px solid var(--line);padding:8px 10px;color:var(--muted)}
    .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .foot{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6}
    .banner{
      margin-top:12px;padding:12px 14px;border-radius:16px;background:#fff7dc;border:1px solid #eadba7;
      font-size:13px;display:none
    }
    @media (max-width:430px){
      .wrap{padding-left:12px;padding-right:12px}
      .card{padding:15px;border-radius:18px}
      .actions{gap:8px}
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ゆるラン</h1>
    <div class="sub">痩せるためじゃなく、動ける身体に戻す。</div>
  </header>

  <div id="installBanner" class="banner">
    ホーム画面に追加すると、アプリっぽく使えます。
    <button id="installBtn" class="ghost" style="margin-left:6px">追加する</button>
  </div>

  <section class="card">
    <div id="today" class="today"></div>
    <p class="question">今日は、どうする？</p>
    <div class="actions">
      <button class="act rest" data-kind="rest">🌿 休む<span class="small">これも正式メニュー</span></button>
      <button class="act" data-kind="walk">🚶 散歩<span class="small">ゆっくりでOK</span></button>
      <button class="act" data-kind="run">🏃 走る<span class="small">歩き混じり歓迎</span></button>
      <button class="act" data-kind="strength">💪 筋トレ<span class="small">少しでも成立</span></button>
      <button class="act" data-kind="other">✨ その他<span class="small">自転車・掃除など</span></button>
    </div>

    <div class="optional">
      <div class="label">時間（入れたい日だけ）</div>
      <div class="chips">
        <button class="chip" data-min="10">10分</button>
        <button class="chip" data-min="20">20分</button>
        <button class="chip" data-min="30">30分</button>
        <button class="chip" data-min="45">45分</button>
        <button class="chip" data-min="60">60分</button>
      </div>
    </div>

    <div class="optional">
      <div class="label">ひとこと（空欄でOK）</div>
      <textarea id="note" placeholder="例：思ったより気持ちよかった"></textarea>
    </div>

    <button id="saveBtn" class="save" disabled>今日はここまで</button>
    <div id="message" class="message"></div>
  </section>

  <section class="card">
    <div class="question" style="font-size:18px">この7日間の足あと</div>
    <div class="sub">連続記録も達成率もありません。空白の日もただの空白。</div>
    <div id="trail" class="trail"></div>
  </section>

  <section class="card">
    <div class="question" style="font-size:18px">このアプリのルール</div>
    <ul class="principles">
      <li>休む日も、失敗じゃない。</li>
      <li>距離・速度・消費カロリーは競わない。</li>
      <li>一度途切れても、再開は「1日目」に戻らない。</li>
      <li>体重はここでは管理しない。</li>
    </ul>
  </section>

  <section class="card">
    <details>
      <summary>履歴とデータ</summary>
      <div id="history" class="history"></div>
      <div class="tools">
        <button id="exportBtn" class="ghost">バックアップ</button>
        <label class="ghost" style="cursor:pointer">
          復元
          <input id="importInput" type="file" accept="application/json" hidden>
        </label>
        <button id="clearBtn" class="ghost">全削除</button>
      </div>
      <div class="foot">
        データはこの端末のブラウザ内だけに保存します。アカウント登録も送信もありません。
      </div>
    </details>
  </section>
</div>

<script>
const labels = {
  rest:["🌿","休む"],
  walk:["🚶","散歩"],
  run:["🏃","走る"],
  strength:["💪","筋トレ"],
  other:["✨","その他"]
};
const messages = {
  rest:[
    "今日は休む日。ちゃんとメニューをこなした。",
    "回復もトレーニングの一部。",
    "休んだから、また動ける。今日はこれでよし。"
  ],
  move:[
    "よし。今日の分はこれで十分。",
    "記録より、動いた事実だけ持って帰ろう。",
    "いい感じ。明日の自分に宿題は残さない。",
    "少しでも動いたなら成立。以上！"
  ]
};
let selectedKind = null;
let selectedMin = null;
let deferredPrompt = null;

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function keyDate(d=new Date()){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function fmtDate(d){
  return new Intl.DateTimeFormat("ja-JP",{month:"numeric",day:"numeric",weekday:"short"}).format(d);
}
const STORAGE_KEY="yururun-records-v2";
function storageAvailable(){
  try{
    const t="__yururun_test__";
    localStorage.setItem(t,"1");
    localStorage.removeItem(t);
    return true;
  }catch(e){ return false; }
}
function load(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY) || localStorage.getItem("yururun-records") || "{}";
    return JSON.parse(raw);
  }catch(e){ return {}; }
}
function saveAll(obj){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(obj));
    return true;
  }catch(e){
    return false;
  }
}
function random(arr){return arr[Math.floor(Math.random()*arr.length)]}

function refreshToday(){
  const d=new Date();
  $("#today").textContent = fmtDate(d);
  const records=load();
  const rec=records[keyDate(d)];
  if(rec){
    selectedKind=rec.kind;
    selectedMin=rec.minutes ?? null;
    $("#note").value=rec.note||"";
    $$(".act").forEach(b=>b.classList.toggle("selected",b.dataset.kind===selectedKind));
    $$(".chip").forEach(b=>b.classList.toggle("selected",Number(b.dataset.min)===selectedMin));
    $("#saveBtn").disabled=false;
    $("#saveBtn").textContent="今日の記録を更新";
  }
}
function renderTrail(){
  const records=load(), box=$("#trail"); box.innerHTML="";
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()-i);
    const k=keyDate(d), rec=records[k];
    const el=document.createElement("div"); el.className="day";
    let inner=`<div class="dow">${new Intl.DateTimeFormat("ja-JP",{weekday:"short"}).format(d)}</div>`;
    if(rec){
      const [ic,lb]=labels[rec.kind]||["•","記録"];
      inner+=`<div class="icon">${ic}</div><div class="mini">${lb}${rec.minutes?` ${rec.minutes}分`:""}</div>`;
    }else{
      inner+=`<div class="icon" style="opacity:.25">・</div><div class="mini">${d.getDate()}日</div>`;
    }
    el.innerHTML=inner; box.appendChild(el);
  }
}
function renderHistory(){
  const records=load();
  const items=Object.entries(records).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,30);
  const box=$("#history"); box.innerHTML="";
  if(!items.length){box.innerHTML='<div class="sub">まだ記録はありません。</div>';return}
  for(const [date,rec] of items){
    const [ic,lb]=labels[rec.kind]||["•","記録"];
    const row=document.createElement("div"); row.className="row";
    row.innerHTML=`
      <div style="font-size:22px">${ic}</div>
      <div class="row-main">
        <div><b>${lb}</b>${rec.minutes?` ・ ${rec.minutes}分`:""}</div>
        <div class="row-date">${date}</div>
        ${rec.note?`<div class="row-note"></div>`:""}
      </div>
      <button class="ghost" data-delete="${date}">削除</button>`;
    if(rec.note) row.querySelector(".row-note").textContent=rec.note;
    box.appendChild(row);
  }
  $$("[data-delete]").forEach(btn=>btn.onclick=()=>{
    const r=load(); delete r[btn.dataset.delete]; saveAll(r); renderTrail(); renderHistory();
    if(btn.dataset.delete===keyDate()) location.reload();
  });
}

$$(".act").forEach(btn=>btn.addEventListener("click",()=>{
  selectedKind=btn.dataset.kind;
  $$(".act").forEach(b=>b.classList.toggle("selected",b===btn));
  $("#saveBtn").disabled=false;
}));
$$(".chip").forEach(btn=>btn.addEventListener("click",()=>{
  const v=Number(btn.dataset.min);
  selectedMin = selectedMin===v ? null : v;
  $$(".chip").forEach(b=>b.classList.toggle("selected",Number(b.dataset.min)===selectedMin));
}));

$("#saveBtn").addEventListener("click",()=>{
  if(!selectedKind)return;
  const records=load();
  records[keyDate()]={kind:selectedKind,minutes:selectedMin,note:$("#note").value.trim(),savedAt:new Date().toISOString()};
  const ok=saveAll(records);
  if(ok){
    const m = selectedKind==="rest" ? random(messages.rest) : random(messages.move);
    $("#message").textContent="保存しました。 "+m;
  }else{
    $("#message").textContent="この開き方では端末保存が使えません。GitHub PagesなどHTTPS上で開くと保存できます。";
  }
  $("#message").style.display="block";
  $("#saveBtn").textContent="今日の記録を更新";
  renderTrail(); renderHistory();
});

$("#exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(load(),null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`yururun-backup-${keyDate()}.json`; a.click(); URL.revokeObjectURL(a.href);
};
$("#importInput").onchange=async e=>{
  const f=e.target.files[0]; if(!f)return;
  try{
    const obj=JSON.parse(await f.text());
    if(!obj || Array.isArray(obj) || typeof obj!=="object") throw new Error();
    saveAll(obj); alert("復元しました。"); location.reload();
  }catch{alert("このファイルは読み込めませんでした。")}
};
$("#clearBtn").onclick=()=>{
  if(confirm("すべての記録を削除しますか？")){
    localStorage.removeItem(STORAGE_KEY); localStorage.removeItem("yururun-records"); location.reload();
  }
};

window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault(); deferredPrompt=e;
  $("#installBanner").style.display="block";
});
$("#installBtn").onclick=async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  $("#installBanner").style.display="none";
};

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}


function showStorageNotice(){
  const isFile = location.protocol === "file:";
  const isSandbox = location.hostname.includes("sandbox") || location.hostname.includes("chatgpt");
  if(!storageAvailable() || isFile){
    const b=$("#installBanner");
    b.style.display="block";
    b.innerHTML="⚠ この開き方では記録が残らない場合があります。GitHub PagesなどHTTPS上に置くと安定して保存できます。";
  } else if(isSandbox){
    const b=$("#installBanner");
    b.style.display="block";
    b.innerHTML="⚠ プレビュー環境では、開き直すと保存領域が変わる場合があります。常用はGitHub Pages版がおすすめです。";
  }
}

showStorageNotice(); refreshToday(); renderTrail(); renderHistory();
</script>
</body>
</html>
